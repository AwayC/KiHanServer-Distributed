syntax = "proto3";

package kihan.internal;

option go_package = "gateway/pb";

// ==========================================
// 1. 数据信封 (Envelope)
// ==========================================

// 网关发给 C++ 后端的请求
message GatewayRequest {
    uint32 conn_id = 1;      // 网关持有的客户端连接ID
    string uid = 2;          // 玩家的 UserID
    uint32 cmd_id = 3;       // 业务命令字
    bytes payload = 4;       // 客户端发上来的具体业务 Protobuf 序列化后的字节流
}

// C++ 后端发给网关的响应 (或主动推送)
message GatewayResponse {
    uint32 conn_id = 1;      // 目标客户端的连接ID
    uint32 cmd_id = 2;       // 响应的业务命令字
    bytes payload = 3;       // 发给客户端的具体业务 Protobuf 字节流
    
    // 网关控制指令 (可选)
    bool kick_client = 4;    // 如果为 true，网关发完包后会主动断开该客户端的物理连接
}


// ==========================================
// 2. gRPC 服务接口定义
// ==========================================

// 大厅业务服务 (C++ 实现) - 适用于匹配、个人信息等
service LobbyService {
    // 典型的一问一答模式 (Unary RPC)
    rpc HandleRequest(GatewayRequest) returns (GatewayResponse);
    
    // 客户端断开连接通知
    rpc ClientDisconnect(GatewayRequest) returns (GatewayResponse);
}

// 战斗对战服务 (C++ 实现) - 适用于高频的战斗同步
service GameService {
    // 双向流 (Bidirectional Streaming) 适用于高频同步
    rpc StreamBattle(stream GatewayRequest) returns (stream GatewayResponse);
}
